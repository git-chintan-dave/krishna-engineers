<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >
    <meta
        name="theme-color"
        content="#171717"
    >

    <title>You're Offline | Krishna Engineers</title>

    <style>
        :root {
            color-scheme: light dark;
            font-family:
                Inter,
                ui-sans-serif,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: #f8fafc;
            color: #0f172a;
        }

        .container {
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        .icon {
            width: 72px;
            height: 72px;
            margin: 0 auto 24px;
            display: grid;
            place-items: center;
            border-radius: 18px;
            background: #e8f0fa;
            color: #171717;
        }

        .icon svg {
            width: 36px;
            height: 36px;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 24px;
            line-height: 1.25;
            font-weight: 700;
        }

        p {
            margin: 0 auto;
            max-width: 360px;
            color: #64748b;
            font-size: 15px;
            line-height: 1.6;
        }

        button {
            margin-top: 28px;
            min-height: 44px;
            padding: 0 20px;
            border: 0;
            border-radius: 10px;
            background: #171717;
            color: white;
            font: inherit;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        button:active {
            transform: translateY(1px);
        }

        @media (prefers-color-scheme: dark) {
            body {
                background: #0f172a;
                color: #f8fafc;
            }

            .icon {
                background: #172b46;
                color: #6ea8df;
            }

            p {
                color: #94a3b8;
            }
        }
    </style>
</head>

<body>
<main class="container">
    <div class="icon" aria-hidden="true">
        <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
        >
            <path d="M12 20h.01" />
            <path d="M8.5 16.5a5 5 0 0 1 7 0" />
            <path d="M5 13a10 10 0 0 1 14 0" />
            <path d="M2 9.5a15 15 0 0 1 20 0" />
            <path d="m3 3 18 18" />
        </svg>
    </div>

    <h1>You're offline</h1>

    <p>
        Krishna Engineers needs an internet connection to load
        this page. Please reconnect and try again.
    </p>

    <button
        type="button"
        onclick="window.location.reload()"
    >
        Try again
    </button>
</main>
</body>
</html>
